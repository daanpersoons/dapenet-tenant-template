# Attaches to the shared Gateway. Only hostnames the cluster admin assigned to your
# namespace are accepted; environments patch in their own hostname.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: whoami
spec:
  parentRefs:
    - name: public
      namespace: gateway
  hostnames:
    - example.invalid
  rules:
    - backendRefs:
        - name: whoami
          port: 80
