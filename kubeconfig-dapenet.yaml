# kubeconfig for dapenet, logging in through Pocket ID (id.dape.pro).
# Needs kubelogin: brew install kubelogin (or: kubectl krew install oidc-login).
#   KUBECONFIG=kubeconfig-dapenet.yaml kubectl -n <your-namespace> get pods
# A browser opens for the login on first use; tokens are cached in ~/.kube/cache/oidc-login.
apiVersion: v1
kind: Config
clusters:
  - name: dapenet
    cluster:
      server: https://k8s.dape.pro
users:
  - name: dapenet-oidc
    user:
      exec:
        apiVersion: client.authentication.k8s.io/v1
        command: kubectl
        args:
          - oidc-login
          - get-token
          - --oidc-issuer-url=https://id.dape.pro
          - --oidc-client-id=f0453f73-d5ff-4fb5-8fb2-79db99f86ff2
          - --oidc-extra-scope=profile
          - --oidc-extra-scope=groups
          - --oidc-pkce-method=S256
        interactiveMode: IfAvailable
contexts:
  - name: dapenet
    context:
      cluster: dapenet
      user: dapenet-oidc
current-context: dapenet
